# Listado único de materiales del sitio.
#
# Para agregar algo, sumá una entrada y corré scripts/sincronizar.py.
# El orden de este archivo es el orden en que se ve en el sitio.
#
#   tipo:    slides o tp
#   bloque:  título de la sección donde aparece
#   numero:  "Clase 8", "TP 1", etc.
#   titulo:  nombre del material
#   archivo: ruta dentro del repo. Si falta, se muestra "Próximamente".
#   fuente:  ruta del original dentro de la carpeta LABOR
#   formato: opcional. Texto del link cuando no es PDF.
#   nota:    opcional. Reemplaza a "Próximamente" en una entrada sin archivo.

